[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skasim"
version = "0.5.0"
description = "SKA synthetic observation simulator"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.0",
    "numpy<2.0",
    "astropy<6.0",
    "aplpy>=2.1",
    "cmasher>=1.8",
    "jinja2>=3.0",
    "radio_beam>=0.3.9",
    "xarray>=2022.11.0",
    "loguru>=0.7.3",
    "shadems>=0.5.4",
]

[project.scripts]
skasim = "skasim.cli:main"

[project.optional-dependencies]
docs = [
    "sphinx>=7.4.7,<9",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-autodoc-typehints>=2.3.0,<4",
]
dev = [
    "pre-commit>=4.0",
    "ruff==0.12.12",  # match .pre-commit-config.yaml's pinned rev exactly
]


[tool.ruff]
# The real runtime floor is Python 3.9 (see tests/, run on 3.9 clusters),
# even though `requires-python` above targets 3.10+ for local development.
# Pinning this stops Ruff from ever suggesting/auto-fixing 3.10-only syntax
# (e.g. `X | None` PEP 604 unions), which pydantic cannot evaluate on 3.9.
target-version = "py39"

[tool.ruff.lint]
# `extend-select` was found to pull in Ruff's full modern default rule set
# (including pyupgrade's UP007/UP045, which rewrite Optional[X]/Union[X, Y]
# to `X | Y`) rather than just adding isort on top of a minimal baseline.
# Use an explicit `select` instead so the rule set is exactly what's intended.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Legacy standalone scripts rely on runtime path mutation, star-imported names,
# and other patterns that cannot be safely rewritten as part of a format baseline.
"scripts/*.py" = ["E402", "E711", "E722", "E741", "F401", "F403", "F405", "F821", "F841"]

[tool.setuptools.packages.find]
where = ["src"]
